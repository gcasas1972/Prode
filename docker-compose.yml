version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: prode-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: prode_root_password
      MYSQL_DATABASE: prode
      MYSQL_USER: prode
      MYSQL_PASSWORD: prode_password
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - prode-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prode-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-your_secret_key_here}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-prode}
      - DB_PASSWORD=${DB_PASSWORD:-prode_password}
      - DB_NAME=${DB_NAME:-prode}
    volumes:
      - ./backend/fixtures:/app/fixtures
    restart: unless-stopped
    networks:
      - prode-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prode-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prode-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  prode-network:
    driver: bridge

volumes:
  db-data:
    driver: local
